# SPIRE agent on the Telos host (Docker). It attests containers by Compose labels.
agent {
  data_dir = "/var/lib/spire/agent"
  log_level = "WARN"
  server_address = "CARDEA_PRIVATE_IP"
  server_port = "8081"
  socket_path = "/run/spire/agent.sock"
  trust_domain = "cardea.internal"
  trust_bundle_path = "/etc/spire/bootstrap-bundle.crt"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}
