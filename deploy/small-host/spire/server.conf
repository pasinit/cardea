# SPIRE server on the Cardea host (ADR-030). One trust domain, SQLite datastore,
# join-token node attestation; no external identity provider is required.
server {
  bind_address = "0.0.0.0"   # firewall to the private network only
  bind_port = "8081"
  trust_domain = "cardea.internal"
  data_dir = "/var/lib/spire/server"
  # Admin API for `spire-server token generate` / `entry create` (pass -socketPath).
  socket_path = "/run/spire-server/api.sock"
  log_level = "WARN"
  ca_ttl = "168h"
  default_x509_svid_ttl = "1h"
  # Short-lived bearer tokens limit replay on the network (ADR-025).
  default_jwt_svid_ttl = "5m"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
