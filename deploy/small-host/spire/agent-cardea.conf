# SPIRE agent on the Cardea host: attests the kernel service by its Unix user.
agent {
  data_dir = "/var/lib/spire/agent"
  log_level = "WARN"
  server_address = "127.0.0.1"
  server_port = "8081"
  socket_path = "/run/spire/agent.sock"
  trust_domain = "cardea.internal"
  # First start only: the server bundle from `spire-server bundle show`.
  trust_bundle_path = "/etc/spire/bootstrap-bundle.crt"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
