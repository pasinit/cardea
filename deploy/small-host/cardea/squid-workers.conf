# Egress proxy for confined worker profiles (ADR-028): a COMPLETE, standalone squid.conf.
# Install it as /etc/squid/squid.conf, replacing Debian's default (keep a backup). Do not
# install it under /etc/squid/conf.d/: the default file allows every destination for
# loopback clients (`http_access allow localhost`) before it includes conf.d, and listens
# on a wildcard port, so a snippet there enforces nothing.
#
# Each networked profile names its own loopback address and port; units may connect only
# to it. Keep every host list identical to the profile's "hosts" in
# /etc/cardea-host-workers.json. A `public_web` profile has no host list: its port allows
# any destination that `non_public` below does not refuse. There is deliberately no
# `include`, no wildcard http_port and no localhost allow rule.

http_port 127.0.10.1:3128 name=browser
http_port 127.0.10.2:3128 name=session
http_port 127.0.10.3:3128 name=web
http_port 127.0.10.4:3128 name=openrouter

acl browser_port myportname browser
acl session_port myportname session
acl web_port myportname web
acl openrouter_port myportname openrouter
acl browser_hosts dstdomain www.example.org
acl session_hosts dstdomain api.anthropic.com
acl openrouter_hosts dstdomain openrouter.ai
acl tls_port port 443
acl safe_ports port 80 443
acl CONNECT method CONNECT
# Destinations that are not the public internet (RFC 6890 special-purpose ranges). For a
# `dst` ACL Squid resolves the requested name, so names pointing at these ranges are
# refused too; the README checks this.
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl non_public dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15
acl non_public dst 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 ::ffff:0:0/96 fc00::/7 fe80::/10 ff00::/8

http_access deny !safe_ports
http_access deny CONNECT !tls_port
# Never relay to the host's own, private, link-local (cloud metadata) or other non-public
# addresses, for any profile.
http_access deny to_localhost
http_access deny to_linklocal
http_access deny non_public
http_access allow session_port session_hosts
http_access allow openrouter_port openrouter_hosts
http_access allow browser_port browser_hosts
# public_web: any public destination.
http_access allow web_port
# Nothing else may use this proxy.
http_access deny all

# A relay only: no cache, no peers, no identifying headers.
cache deny all
cache_mem 8 MB
icp_port 0
htcp_port 0
via off
forwarded_for delete
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
shutdown_lifetime 3 seconds
