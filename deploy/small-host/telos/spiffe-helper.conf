# spiffe-helper sidecar next to Telos: keeps a fresh JWT-SVID for the Cardea audience
# in a file that Telos reads on every request (TELOS_CARDEA_TOKEN_FILE).
agent_address = "/run/spire/agent.sock"
cert_dir = "/svid"
daemon_mode = true
jwt_svids = [
  {
    jwt_audience = "cardea-kernel"
    jwt_svid_file_name = "telos.jwt"
  }
]
