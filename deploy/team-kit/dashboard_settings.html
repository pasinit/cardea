<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team settings</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1rem; color: #1b1f24; background: #fafafa; overflow-wrap: anywhere; max-width: 48rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .75rem; }
  h3 { font-size: .95rem; margin: 1rem 0 .3rem; border-bottom: 1px solid #d0d7de; }
  label { display: block; margin: .4rem 0 .1rem; color: #57606a; }
  input, textarea, select, button { font: inherit; padding: .3rem .5rem; max-width: 100%; }
  input, textarea { width: 100%; }
  textarea { min-height: 4rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; }
  .row > div { flex: 1 1 8rem; }
  .muted { color: #57606a; }
  .bad { color: #b42318; }
  .ok { color: #1a7f37; }
  pre { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: .5rem .7rem; white-space: pre-wrap; }
  #actions { display: flex; gap: .5rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Team settings</h1>
<p class="muted">Only the team's supervisor may change these; the kernel checks that on every step. Nothing changes until you confirm a preview. Credentials are not settings and are never shown.</p>
<label for="team">Team</label>
<select id="team"></select>
<div id="status"></div>
<form id="form" autocomplete="off"></form>
<div id="actions"></div>
<h3>Preview</h3>
<pre id="preview">No preview yet.</pre>
<script src="/dashboard_settings.js"></script>
</body>
</html>
