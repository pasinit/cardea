  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: .5rem .7rem; }

  .meter { height: 8px; background: #eaeef2; border-radius: 4px; overflow: hidden; margin: .3rem 0; }

  .grid { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .member { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: .6rem .7rem; }
  @media (max-width: 600px) { body { margin: .6rem; font-size: 15px; } .filters > * { flex: 1 1 100%; } }
