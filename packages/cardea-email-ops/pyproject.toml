[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "cardea-email-ops"
version = "0.1.0"
description = "External email operations (email.send and its reply poller) for Cardea agent teams (ADR-039)"
requires-python = ">=3.12"
# Installed into the kernel's own environment, which provides `cardea`, `httpx` and `pydantic`.
# SMTP and IMAP use the standard library.
dependencies = []

# ADR-023: a descriptor's `handler`, `reconciler` and reply `poller` name entry points here.
[project.entry-points."cardea.operations"]
"email.send" = "cardea_email_ops:send"
"email.find_sent" = "cardea_email_ops:find_sent"
"email.poll_replies" = "cardea_email_ops:poll_replies"

[tool.hatch.build.targets.wheel]
packages = ["src/cardea_email_ops"]
