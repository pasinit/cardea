[project]
name = "cardea-absurd-fit"
version = "0.1.0"
description = "Isolated Absurd evaluation; not the Cardea runtime"
requires-python = ">=3.12"
dependencies = ["absurd-sdk==0.5.0", "psycopg[binary]==3.3.6", "pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
