[project]
name = "cardea-hatchet-fit"
version = "0.1.0"
description = "Isolated Hatchet evaluation; not the Cardea runtime"
requires-python = ">=3.12"
dependencies = ["hatchet-sdk==1.41.0", "psycopg[binary]==3.3.6", "pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
