[project]
name = "cardea-dbos-fit"
version = "0.1.0"
description = "Isolated DBOS evaluation; not the Cardea runtime"
requires-python = ">=3.12"
dependencies = ["dbos==3.0.0", "pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
